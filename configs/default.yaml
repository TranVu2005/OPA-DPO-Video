# OPA-DPO-Video defaults. Paper values (CVPR 2025, App. A.1) unless noted.
# Override any key on the command line: python -m opadpo_video.train_dpo dpo.beta=0.2

work_dir: work                       # rollouts, reports, sft.jsonl, dpo.jsonl, ref_logps/

model:
  base_model: Qwen/Qwen2.5-VL-7B-Instruct   # or a local path (Gadi compute nodes are offline)
  attn_implementation: sdpa                  # flash_attention_2 if flash-attn is installed
  gradient_checkpointing: true
  lora_rank: 256
  lora_alpha: 512
  lora_dropout: 0.0
  lora_vision: true                          # LoRA on ViT + merger too, as the paper wraps the whole backbone

video:                                       # video additions (not in the paper)
  n_frames: 16                               # even; Qwen2.5-VL merges frames in pairs
  max_pixels: 200704                         # 448*448 per frame
  min_pixels: 100352                         # 128*28*28
  mask_ratio: 0.3                            # distorted m': 30% pixels -> mean colour
  mask_method: pixel                         # pixel | tube | frame

rollout:
  max_new_tokens: 1024
  temperature: 1.0
  top_k: 30
  top_p: 0.95
  batch_size: 4

expert:
  base_url: https://api.openai.com/v1        # any OpenAI-compatible endpoint (incl. local vLLM)
  api_key_env: OPENAI_API_KEY
  model: gpt-4o                              # paper used GPT-4V (2024-02-15); needs a vision model
  n_frames: 8
  frame_max_side: 768
  temperature: 0.0
  max_tokens: 4096
  workers: 8
  max_retries: 5

weights:
  hal: {1: 2.5, 2: 2.0, 3: 1.5, 4: 1.0}      # W_hal by sentence score (official code values)
  img:                                       # W_img by error type (Table 7 + temporal)
    correct: 1.0
    language comprehension error: 1.0
    visual recognition error: 3.0
    temporal error: 3.0

train:                                       # OPA stage values; train_dpo.pbs overrides for DPO
  output_dir: runs/opa
  init_adapter: null
  num_train_epochs: 2
  learning_rate: 2.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 32            # 4 GPUs x 1 x 32 = 128 (paper)
  max_response_tokens: 1024
  save_steps: 100
  logging_steps: 1
  seed: 42
  report_to: none
  dataloader_num_workers: 4
  deepspeed: null

dpo:
  beta: 0.1
  gamma_if: 0.2
  gamma_anc: 1.0
  delta: 0.0
  loss_mode: paper                           # paper | official (token-level, as released code)
  official_response_len: 896
